<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#141625"><meta name="description" content="SongHub Digital Songbook v1 — search songs by title, artist or karaoke number."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"><title>SongHub Digital Songbook v1</title></head><body><main><header><div class="brand"><div class="logo">♫</div><div><h1>SongHub <span>Digital Songbook</span></h1><small>Version 1 · Karaoke song finder</small></div></div><button id="share" class="secondary" title="Share app">↗ Share</button></header><section class="hero"><h2>Find your next song.</h2><p>Search by title, artist or karaoke number.</p><label class="search"><span>⌕</span><input id="q" type="search" placeholder="Try ‘A Thousand Years’ or 35754" autocomplete="off" autofocus><button id="clear" aria-label="Clear search">×</button></label><div class="filters"><button class="active" data-mode="all">All songs</button><button data-mode="favorites">♥ Favorites</button><select id="sort" aria-label="Sort songs"><option value="title">A–Z title</option><option value="number">Song number</option><option value="artist">Artist</option></select></div></section><section class="results"><div class="meta"><strong id="count">Loading songs…</strong><span id="status"></span></div><div id="list" aria-live="polite"></div><button id="more" class="more" hidden>Load more songs</button></section><footer>SongHub Digital Songbook v1 · Song numbers and titles extracted from the supplied PDF. Please verify entries against your original songbook.</footer></main><script src="app.js" defer></script></body></html>
